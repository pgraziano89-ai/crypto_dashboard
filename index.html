<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Market Dashboard</title>


<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #050505;
    color: #ffffff;

    font-family: Arial, Helvetica, sans-serif;

    overflow: hidden;

}


body {

    padding:
        24px
        8vw
        15px
        8vw;

}


/* =====================================================
   TITOLO
===================================================== */

h1 {

    text-align: center;

    font-size: 34px;

    letter-spacing: 6px;

    margin:
        0 0 17px 0;

}


/* =====================================================
   TITOLI SEZIONI
===================================================== */

.section-title {

    color: #777777;

    font-size: 18px;

    letter-spacing: 4px;

    border-bottom:
        1px solid #292929;

    padding-bottom: 7px;

    margin-bottom: 12px;

}


/* =====================================================
   BTC ETH SOL
===================================================== */

.crypto-top {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 16px;

    width: 100%;

}


.crypto-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    min-height: 145px;

    padding:
        15px 20px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);

}


.token-header {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 11px;

}


.logo {

    width: 42px;

    height: 42px;

    object-fit: contain;

    border-radius: 50%;

}


.symbol {

    font-size: 27px;

    font-weight: bold;

}


.price {

    margin-top: 7px;

    font-size: 37px;

    font-weight: bold;

    white-space: nowrap;

    text-align: center;

}


.change {

    margin-top: 5px;

    font-size: 18px;

    font-weight: bold;

}


.up {

    color: #00d084;

}


.down {

    color: #ff4d4d;

}


/* =====================================================
   HNT + GRAFICO
===================================================== */

.hnt-row {

    display: grid;

    grid-template-columns:
        0.62fr
        1.38fr;

    gap: 16px;

    width: 100%;

    margin-top: 16px;

}


/* =====================================================
   HNT CARD
===================================================== */

.hnt-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    min-height: 235px;

    padding: 18px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);

}


.hnt-header {

    display: flex;

    align-items: center;

    gap: 10px;

}


.hnt-logo {

    width: 43px;

    height: 43px;

    object-fit: contain;

    border-radius: 50%;

}


.hnt-symbol {

    font-size: 28px;

    font-weight: bold;

}


.hnt-price {

    font-size: 44px;

    font-weight: bold;

    margin-top: 7px;

    white-space: nowrap;

}


.hnt-change {

    font-size: 20px;

    font-weight: bold;

    margin-top: 4px;

}


.hnt-label {

    color: #666666;

    font-size: 13px;

    margin-top: 7px;

    letter-spacing: 1px;

}


/* =====================================================
   GRAFICO
===================================================== */

.chart-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    min-height: 235px;

    padding:
        12px
        15px
        10px
        15px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);

}


.chart-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: #888888;

    font-size: 15px;

    letter-spacing: 1px;

    padding:
        0 4px 5px 4px;

}


#chartResult {

    font-weight: bold;

}


.chart-area {

    width: 100%;

    height: 190px;

    position: relative;

}


#hntChart {

    display: block;

    width: 100%;

    height: 190px;

}


/* =====================================================
   STOCK
===================================================== */

.stock-section {

    margin-top: 16px;

}


.stock-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    min-height: 225px;

    padding:
        15px
        22px
        14px
        22px;

    width: 100%;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);

    overflow: hidden;

}


/* =====================================================
   WE RIDE
===================================================== */

.stock-header {

    display: flex;

    align-items: center;

    gap: 14px;

    min-height: 55px;

}


.weride-logo {

    width: 48px;

    height: 48px;

    flex-shrink: 0;

}


.stock-title {

    font-size: 27px;

    font-weight: bold;

}


.stock-subtitle {

    color: #777777;

    font-size: 14px;

    margin-top: 3px;

}


/* =====================================================
   TRADINGVIEW
===================================================== */

.tradingview-wrapper {

    width: 100%;

    height: 145px;

    margin-top: 5px;

    overflow: hidden;

}


.tradingview-widget-container {

    width: 100%;

    height: 145px;

}


.tradingview-widget-container__widget {

    width: 100%;

    height: 145px;

}


/* =====================================================
   STATO
===================================================== */

#updated {

    text-align: center;

    color: #777777;

    font-size: 13px;

    margin-top: 7px;

}


.status {

    display: inline-block;

    width: 8px;

    height: 8px;

    background: #00d084;

    border-radius: 50%;

    margin-right: 5px;

}


.status.old {

    background: #ffb000;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 1100px) {

    body {

        padding-left: 4vw;

        padding-right: 4vw;

    }


    h1 {

        font-size: 27px;

    }


    .price {

        font-size: 30px;

    }


    .hnt-price {

        font-size: 35px;

    }

}


@media (max-width: 750px) {

    body {

        overflow-y: auto;

    }


    .crypto-top {

        grid-template-columns: 1fr;

    }


    .hnt-row {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>

<script>

/* =====================================================
   CONFIGURAZIONE
===================================================== */

var PRICE_REFRESH = 40000;


/*
   Memoria dei prezzi HNT.

   Il grafico viene costruito usando
   i prezzi ricevuti dalla stessa API
   che alimenta le card.
*/

var hntHistory = [];


/*
   Numero massimo di punti visualizzati.
*/

var MAX_POINTS = 40;


/* =====================================================
   FORMATTA PREZZO
===================================================== */

function formatPrice(
    price
) {

    if (
        price === null ||
        price === undefined ||
        isNaN(price)
    ) {

        return "---";

    }


    var decimals = 2;


    if (
        price < 1
    ) {

        decimals = 4;

    }


    if (
        price < 0.01
    ) {

        decimals = 6;

    }


    return new Intl.NumberFormat(

        "en-US",

        {

            style:
                "currency",

            currency:
                "USD",

            minimumFractionDigits:
                decimals,

            maximumFractionDigits:
                decimals

        }

    ).format(
        price
    );

}



/* =====================================================
   RICHIESTA COINPAPRIKA
===================================================== */

function requestCoin(
    id,
    callback
) {


    var xhr =
        new XMLHttpRequest();


    var url =

        "https://api.coinpaprika.com/v1/tickers/" +
        id;


    xhr.open(
        "GET",
        url,
        true
    );


    xhr.onreadystatechange =
        function() {


            if (
                xhr.readyState != 4
            ) {

                return;

            }


            if (
                xhr.status == 200
            ) {


                try {


                    var data =
                        JSON.parse(
                            xhr.responseText
                        );


                    callback(
                        data
                    );


                }
                catch (
                    error
                ) {


                    callback(
                        null
                    );

                }

            }
            else {


                callback(
                    null
                );

            }

        };


    xhr.onerror =
        function() {

            callback(
                null
            );

        };


    xhr.send(
        null
    );

}



/* =====================================================
   MOSTRA PREZZO
===================================================== */

function displayCoin(
    elementId,
    changeId,
    data
) {


    if (
        !data ||
        !data.quotes ||
        !data.quotes.USD
    ) {

        return false;

    }


    var usd =
        data.quotes.USD;


    var price =
        Number(
            usd.price
        );


    var change =
        Number(
            usd.percent_change_24h
        );


    if (
        isNaN(price)
    ) {

        return false;

    }


    var priceElement =
        document.getElementById(
            elementId
        );


    var changeElement =
        document.getElementById(
            changeId
        );


    if (
        priceElement
    ) {

        priceElement.textContent =
            formatPrice(
                price
            );

    }


    if (
        changeElement &&
        !isNaN(change)
    ) {


        changeElement.textContent =

            (
                change >= 0
                ? "▲ "
                : "▼ "
            ) +

            Math.abs(
                change
            ).toFixed(2) +

            "%";


        if (
            changeId ==
            "helium-change"
        ) {


            changeElement.className =

                "hnt-change " +

                (
                    change >= 0
                    ? "up"
                    : "down"
                );

        }
        else {


            changeElement.className =

                "change " +

                (
                    change >= 0
                    ? "up"
                    : "down"
                );

        }

    }


    return true;

}



/* =====================================================
   AGGIORNA PREZZI
===================================================== */

function updatePrices() {


    var valid = 0;

    var finished = 0;


    /*
       BTC
    */

    requestCoin(

        "btc-bitcoin",

        function(
            data
        ) {


            if (
                displayCoin(

                    "bitcoin",

                    "bitcoin-change",

                    data

                )
            ) {

                valid++;

            }


            finished++;

            finish();

        }

    );


    /*
       ETH
    */

    requestCoin(

        "eth-ethereum",

        function(
            data
        ) {


            if (
                displayCoin(

                    "ethereum",

                    "ethereum-change",

                    data

                )
            ) {

                valid++;

            }


            finished++;

            finish();

        }

    );


    /*
       SOL
    */

    requestCoin(

        "sol-solana",

        function(
            data
        ) {


            if (
                displayCoin(

                    "solana",

                    "solana-change",

                    data

                )
            ) {

                valid++;

            }


            finished++;

            finish();

        }

    );


    /*
       HNT
    */

    requestCoin(

        "hnt-helium",

        function(
            data
        ) {


            if (
                displayCoin(

                    "helium",

                    "helium-change",

                    data

                )
            ) {


                valid++;


                /*
                   Salva il prezzo HNT
                   per il grafico.
                */

                if (
                    data &&
                    data.quotes &&
                    data.quotes.USD
                ) {


                    var hntPrice =
                        Number(
                            data
                            .quotes
                            .USD
                            .price
                        );


                    if (
                        !isNaN(
                            hntPrice
                        )
                    ) {


                        hntHistory.push({

                            time:
                                new Date()
                                .getTime(),

                            price:
                                hntPrice

                        });


                        /*
                           Massimo 40 punti.
                        */

                        while (
                            hntHistory.length >
                            MAX_POINTS
                        ) {

                            hntHistory.shift();

                        }


                        drawHntChart();

                    }

                }

            }


            finished++;

            finish();

        }

    );


    function finish() {


        if (
            finished != 4
        ) {

            return;

        }


        var statusClass =

            valid > 0
            ? "status"
            : "status old";


        document.getElementById(
            "updated"
        ).innerHTML =

            '<span class="' +
            statusClass +
            '"></span>' +

            valid +
            "/4 crypto · " +

            new Date()
            .toLocaleTimeString(
                "it-IT"
            ) +

            " · refresh 40s";

    }

}



/* =====================================================
   GRAFICO HNT
===================================================== */

function drawHntChart() {


    var canvas =
        document.getElementById(
            "hntChart"
        );


    if (
        !canvas
    ) {

        return;

    }


    var width =
        canvas.clientWidth;


    var height =
        canvas.clientHeight;


    if (
        width <= 0 ||
        height <= 0
    ) {

        return;

    }


    /*
       Compatibilità con
       browser Tizen vecchi.
    */

    canvas.width =
        width;

    canvas.height =
        height;


    var ctx =
        canvas.getContext(
            "2d"
        );


    /*
       SFONDO
    */

    ctx.fillStyle =
        "#0b0b0b";


    ctx.fillRect(

        0,
        0,
        width,
        height

    );


    /*
       Ancora pochi dati:
       mostriamo un messaggio.
    */

    if (
        hntHistory.length < 2
    ) {


        ctx.fillStyle =
            "#555555";


        ctx.font =
            "14px Arial";


        ctx.fillText(

            "Raccolta dati HNT...",

            20,

            height / 2

        );


        document.getElementById(
            "chartResult"
        ).textContent =
            "LIVE";


        return;

    }


    /*
       MARGINI
    */

    var left = 8;

    var right = 62;

    var top = 10;

    var bottom = 20;


    var chartWidth =

        width -
        left -
        right;


    var chartHeight =

        height -
        top -
        bottom;


    /*
       VALORI
    */

    var values = [];

    var i;


    for (
        i = 0;
        i < hntHistory.length;
        i++
    ) {

        values.push(
            hntHistory[i].price
        );

    }


    var min =
        Math.min.apply(
            null,
            values
        );


    var max =
        Math.max.apply(
            null,
            values
        );


    var range =
        max - min;


    if (
        range <= 0
    ) {

        range =
            max * 0.01;

    }


    min -=
        range * 0.15;


    max +=
        range * 0.15;


    /*
       COORDINATE
    */

    function priceX(
        index
    ) {

        return left +

            (
                index /
                (
                    values.length - 1
                )
            ) *

            chartWidth;

    }


    function priceY(
        price
    ) {

        return top +

            (
                (max - price) /
                (max - min)
            ) *

            chartHeight;

    }


    /*
       GRIGLIA
    */

    ctx.font =
        "11px Arial";


    for (
        i = 0;
        i <= 4;
        i++
    ) {


        var y =

            top +

            (
                i / 4
            ) *

            chartHeight;


        ctx.strokeStyle =
            "rgba(255,255,255,0.07)";


        ctx.lineWidth = 1;


        ctx.beginPath();


        ctx.moveTo(
            left,
            y
        );


        ctx.lineTo(

            left +
            chartWidth,

            y

        );


        ctx.stroke();


        var gridPrice =

            max -

            (
                i / 4
            ) *

            (
                max - min
            );


        ctx.fillStyle =
            "#777777";


        ctx.fillText(

            "$" +
            gridPrice.toFixed(3),

            width -
            right +
            7,

            y + 4

        );

    }


    /*
       TREND
    */

    var firstPrice =
        values[0];


    var lastPrice =
        values[
            values.length - 1
        ];


    var trendColor =

        lastPrice >= firstPrice

        ? "#00d084"

        : "#ff4d4d";


    /*
       AREA SOTTO LA LINEA
    */

    ctx.beginPath();


    for (
        i = 0;
        i < values.length;
        i++
    ) {


        var x =
            priceX(i);


        var y2 =
            priceY(
                values[i]
            );


        if (
            i == 0
        ) {

            ctx.moveTo(
                x,
                y2
            );

        }
        else {

            ctx.lineTo(
                x,
                y2
            );

        }

    }


    ctx.lineTo(

        left +
        chartWidth,

        height -
        bottom

    );


    ctx.lineTo(

        left,

        height -
        bottom

    );


    ctx.closePath();


    ctx.fillStyle =

        lastPrice >= firstPrice

        ? "rgba(0,208,132,0.13)"

        : "rgba(255,77,77,0.13)";


    ctx.fill();



    /*
       LINEA PRINCIPALE
    */

    ctx.beginPath();


    for (
        i = 0;
        i < values.length;
        i++
    ) {


        x =
            priceX(i);


        y2 =
            priceY(
                values[i]
            );


        if (
            i == 0
        ) {

            ctx.moveTo(
                x,
                y2
            );

        }
        else {

            ctx.lineTo(
                x,
                y2
            );

        }

    }


    ctx.strokeStyle =
        trendColor;


    ctx.lineWidth = 3;


    ctx.lineJoin =
        "round";


    ctx.lineCap =
        "round";


    ctx.stroke();



    /*
       ULTIMO PUNTO
    */

    var lastX =
        priceX(
            values.length - 1
        );


    var lastY =
        priceY(
            lastPrice
        );


    ctx.beginPath();


    ctx.arc(

        lastX,
        lastY,
        4,
        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        trendColor;


    ctx.fill();



    /*
       LINEA PREZZO ATTUALE
    */

    ctx.strokeStyle =
        trendColor;


    ctx.lineWidth = 1;


    ctx.setLineDash(
        [4,4]
    );


    ctx.beginPath();


    ctx.moveTo(
        left,
        lastY
    );


    ctx.lineTo(

        left +
        chartWidth,

        lastY

    );


    ctx.stroke();


    ctx.setLineDash([]);



    /*
       BOX PREZZO
    */

    ctx.fillStyle =
        trendColor;


    ctx.fillRect(

        width -
        right +
        3,

        lastY - 10,

        right - 5,

        20

    );


    ctx.fillStyle =
        "#050505";


    ctx.font =
        "bold 11px Arial";


    ctx.fillText(

        "$" +
        lastPrice.toFixed(3),

        width -
        right +
        7,

        lastY + 4

    );



    /*
       VARIAZIONE
    */

    var change =

        (
            (
                lastPrice -
                firstPrice
            ) /
            firstPrice
        ) *
        100;


    var result =
        document.getElementById(
            "chartResult"
        );


    result.textContent =

        (
            change >= 0
            ? "+"
            : ""
        ) +

        change.toFixed(2) +

        "%";


    result.style.color =
        trendColor;



    /*
       ORARIO PRIMO PUNTO
    */

    ctx.fillStyle =
        "#555555";


    ctx.font =
        "10px Arial";


    var firstDate =
        new Date(
            hntHistory[0].time
        );


    var lastDate =
        new Date(
            hntHistory[
                hntHistory.length - 1
            ].time
        );


    var firstText =

        firstDate
        .toLocaleTimeString(

            "it-IT",

            {
                hour:
                    "2-digit",

                minute:
                    "2-digit"

            }

        );


    var lastText =

        lastDate
        .toLocaleTimeString(

            "it-IT",

            {
                hour:
                    "2-digit",

                minute:
                    "2-digit"

            }

        );


    ctx.fillText(

        firstText,

        left,

        height - 5

    );


    var lastTextWidth =
        ctx.measureText(
            lastText
        ).width;


    ctx.fillText(

        lastText,

        left +
        chartWidth -
        lastTextWidth,

        height - 5

    );

}



/* =====================================================
   AVVIO
===================================================== */

updatePrices();


/*
   Aggiornamento prezzi:
   ogni 40 secondi.
*/

setInterval(

    updatePrices,

    PRICE_REFRESH

);


/*
   Ridisegna se cambia
   la dimensione della finestra.
*/

window.addEventListener(

    "resize",

    function() {

        drawHntChart();

    }

);

</script>
