<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>TEST BTC</title>

<style>
body {
    background: #000;
    color: #fff;
    font-family: Arial;
    text-align: center;
    padding-top: 100px;
}

#price {
    font-size: 50px;
    color: #00d084;
}
</style>

</head>

<body>

<h1>BITCOIN</h1>

<div id="price">CARICAMENTO...</div>

<script>

var xhr = new XMLHttpRequest();

xhr.open(
    "GET",
    "https://api.coinpaprika.com/v1/tickers/btc-bitcoin",
    true
);

xhr.onreadystatechange = function() {

    if (xhr.readyState == 4) {

        if (xhr.status == 200) {

            try {

                var data =
                    JSON.parse(
                        xhr.responseText
                    );

                var price =
                    data.quotes.USD.price;

                document.getElementById(
                    "price"
                ).innerHTML =
                    "$ " +
                    Number(price).toFixed(2);

            }
            catch (e) {

                document.getElementById(
                    "price"
                ).innerHTML =
                    "ERRORE JSON";

            }

        }
        else {

            document.getElementById(
                "price"
            ).innerHTML =
                "ERRORE " +
                xhr.status;

        }

    }

};

xhr.onerror = function() {

    document.getElementById(
        "price"
    ).innerHTML =
        "ERRORE RETE";

};

xhr.send(null);

</script>

</body>
</html>
