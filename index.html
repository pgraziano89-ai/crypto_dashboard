<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TEST WeRide WRD</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    padding-top: 100px;
}

h1 {
    font-size: 32px;
    letter-spacing: 5px;
}

#price {
    margin-top: 35px;
    font-size: 60px;
    font-weight: bold;
    color: #00d084;
}

#status {
    margin-top: 20px;
    color: #777;
    font-size: 16px;
}

</style>

</head>

<body>

<h1>WeRide · WRD</h1>

<div id="price">
    CARICAMENTO...
</div>

<div id="status">
    Connessione...
</div>

<script>

var API_KEY = "LA_TUA_API_KEY";

function getWeRidePrice() {

    var xhr = new XMLHttpRequest();

    var url =
        "https://www.alphavantage.co/query" +
        "?function=GLOBAL_QUOTE" +
        "&symbol=WRD" +
        "&apikey=" +
        API_KEY;

    xhr.open(
        "GET",
        url,
        true
    );

    xhr.onreadystatechange = function() {

        if (xhr.readyState !== 4) {
            return;
        }

        if (xhr.status !== 200) {

            document.getElementById(
                "price"
            ).innerHTML =
                "ERRORE " + xhr.status;

            document.getElementById(
                "status"
            ).innerHTML =
                "Richiesta API fallita";

            return;
        }

        try {

            var data =
                JSON.parse(
                    xhr.responseText
                );

            console.log(data);

            if (
                data["Global Quote"] &&
                data["Global Quote"]["05. price"]
            ) {

                var price =
                    Number(
                        data["Global Quote"]["05. price"]
                    );

                document.getElementById(
                    "price"
                ).innerHTML =
                    "$ " +
                    price.toFixed(2);

                document.getElementById(
                    "status"
                ).innerHTML =
                    "WRD · NASDAQ · " +
                    new Date().toLocaleTimeString("it-IT");

            }
            else if (data["Note"]) {

                document.getElementById(
                    "price"
                ).innerHTML =
                    "LIMITE API";

                document.getElementById(
                    "status"
                ).innerHTML =
                    data["Note"];

            }
            else if (data["Information"]) {

                document.getElementById(
                    "price"
                ).innerHTML =
                    "API KEY";

                document.getElementById(
                    "status"
                ).innerHTML =
                    data["Information"];

            }
            else {

                document.getElementById(
                    "price"
                ).innerHTML =
                    "NO DATA";

                document.getElementById(
                    "status"
                ).innerHTML =
                    "WRD non restituito dall'API";

            }

        }
        catch (e) {

            document.getElementById(
                "price"
            ).innerHTML =
                "ERRORE JSON";

            document.getElementById(
                "status"
            ).innerHTML =
                e.message;

        }

    };

    xhr.onerror = function() {

        document.getElementById(
            "price"
        ).innerHTML =
            "ERRORE RETE";

        document.getElementById(
            "status"
        ).innerHTML =
            "Il browser non riesce a raggiungere Alpha Vantage";

    };

    xhr.send(null);
}


/* TEST */

getWeRidePrice();

</script>

</body>

</html>
