<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Market Dashboard</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #050505;
    color: #ffffff;

    font-family: Arial, Helvetica, sans-serif;

    overflow: hidden;
}


body {

    padding:
        24px
        8vw
        15px
        8vw;
}


/* =====================================================
   TITOLO
===================================================== */

h1 {

    text-align: center;

    font-size: 34px;

    letter-spacing: 6px;

    margin:
        0 0 17px 0;
}


/* =====================================================
   SEZIONI
===================================================== */

.section-title {

    color: #777777;

    font-size: 18px;

    letter-spacing: 4px;

    border-bottom:
        1px solid #292929;

    padding-bottom: 7px;

    margin-bottom: 12px;
}


/* =====================================================
   CRYPTO TOP
   FLEX AL POSTO DI GRID
===================================================== */

.crypto-top {

    display: flex;

    width: 100%;

    height: 145px;

    gap: 16px;
}


.crypto-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    height: 145px;

    padding:
        15px 20px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);

    flex: 1;

    width: 33.33%;

    overflow: hidden;
}


.token-header {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 11px;
}


.logo {

    width: 42px;
    height: 42px;

    object-fit: contain;

    border-radius: 50%;
}


.symbol {

    font-size: 27px;

    font-weight: bold;
}


.price {

    margin-top: 7px;

    font-size: 34px;

    font-weight: bold;

    white-space: nowrap;

    text-align: center;
}


.change {

    margin-top: 5px;

    font-size: 18px;

    font-weight: bold;
}


.up {

    color: #00d084;
}


.down {

    color: #ff4d4d;
}


/* =====================================================
   HNT + GRAFICO
   FLEX AL POSTO DI GRID
===================================================== */

.hnt-row {

    display: flex;

    width: 100%;

    height: 235px;

    margin-top: 16px;

    gap: 16px;
}


/* =====================================================
   HNT CARD
===================================================== */

.hnt-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    height: 235px;

    padding: 18px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);

    width: 31%;

    flex-shrink: 0;
}


.hnt-header {

    display: flex;

    align-items: center;

    gap: 10px;
}


.hnt-logo {

    width: 43px;
    height: 43px;

    object-fit: contain;

    border-radius: 50%;
}


.hnt-symbol {

    font-size: 28px;

    font-weight: bold;
}


.hnt-price {

    font-size: 42px;

    font-weight: bold;

    margin-top: 7px;

    white-space: nowrap;
}


.hnt-change {

    font-size: 20px;

    font-weight: bold;

    margin-top: 4px;
}


.hnt-label {

    color: #666666;

    font-size: 13px;

    margin-top: 7px;

    letter-spacing: 1px;
}


/* =====================================================
   GRAFICO HNT
===================================================== */

.chart-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    height: 235px;

    padding:
        12px
        15px
        10px
        15px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);

    flex: 1;

    min-width: 0;

    overflow: hidden;
}


.chart-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: #888888;

    font-size: 15px;

    letter-spacing: 1px;

    padding:
        0 4px 5px 4px;
}


#chartResult {

    font-weight: bold;
}


.chart-area {

    width: 100%;

    height: 190px;

    position: relative;
}


#hntChart {

    display: block;

    width: 100%;

    height: 190px;
}


/* =====================================================
   STOCK
===================================================== */

.stock-section {

    margin-top: 16px;
}


.stock-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    height: 225px;

    padding:
        15px
        22px
        14px
        22px;

    width: 100%;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);

    overflow: hidden;
}


/* =====================================================
   WE RIDE
===================================================== */

.stock-header {

    display: flex;

    align-items: center;

    gap: 14px;

    min-height: 55px;
}


.weride-logo {

    width: 48px;
    height: 48px;

    flex-shrink: 0;
}


.stock-title {

    font-size: 27px;

    font-weight: bold;
}


.stock-subtitle {

    color: #777777;

    font-size: 14px;

    margin-top: 3px;
}


/* =====================================================
   TRADINGVIEW
===================================================== */

.tradingview-wrapper {

    width: 100%;

    height: 145px;

    margin-top: 5px;

    overflow: hidden;
}


.tradingview-widget-container {

    width: 100%;

    height: 145px;
}


.tradingview-widget-container__widget {

    width: 100%;

    height: 145px;
}


/* =====================================================
   STATO
===================================================== */

#updated {

    text-align: center;

    color: #777777;

    font-size: 13px;

    margin-top: 7px;
}


.status {

    display: inline-block;

    width: 8px;
    height: 8px;

    background: #00d084;

    border-radius: 50%;

    margin-right: 5px;
}


.status.old {

    background: #ffb000;
}


/* =====================================================
   TV
===================================================== */

@media (max-width: 1100px) {

    body {

        padding-left: 4vw;

        padding-right: 4vw;
    }


    h1 {

        font-size: 27px;
    }


    .price {

        font-size: 28px;
    }


    .hnt-price {

        font-size: 34px;
    }

}


/*
   IMPORTANTE:
   NON mettiamo grid-template-columns
   per la modalità mobile perché
   il vecchio Tizen potrebbe interpretarla male.
*/

</style>

</head>

<script>

/* =====================================================
   CONFIG
===================================================== */

var PRICE_REFRESH = 300000;

var CHART_REFRESH = 300000;


var COIN_IDS = {

    bitcoin:
        "btc-bitcoin",

    ethereum:
        "eth-ethereum",

    solana:
        "sol-solana",

    helium:
        "hnt-helium"

};



/* =====================================================
   FORMATTA PREZZO
===================================================== */

function formatPrice(price) {


    if (
        price === null ||
        price === undefined ||
        isNaN(price)
    ) {

        return "---";

    }


    var decimals = 2;


    if (
        price < 1
    ) {

        decimals = 4;

    }


    if (
        price < 0.01
    ) {

        decimals = 6;

    }


    return "$ " +
        Number(price)
        .toFixed(decimals);

}



/* =====================================================
   PREZZO SINGOLO
===================================================== */

function getCoin(
    symbol,
    callback
) {


    var xhr =
        new XMLHttpRequest();


    var url =

        "https://api.coinpaprika.com/v1/tickers/" +

        COIN_IDS[symbol];


    xhr.open(
        "GET",
        url,
        true
    );


    xhr.onreadystatechange =
        function() {


            if (
                xhr.readyState != 4
            ) {

                return;

            }


            if (
                xhr.status == 200
            ) {


                try {

                    var data =
                        JSON.parse(
                            xhr.responseText
                        );


                    callback(
                        symbol,
                        data
                    );

                }
                catch (e) {

                    callback(
                        symbol,
                        null
                    );

                }

            }
            else {

                callback(
                    symbol,
                    null
                );

            }

        };


    xhr.onerror =
        function() {

            callback(
                symbol,
                null
            );

        };


    xhr.send(null);

}



/* =====================================================
   VISUALIZZA PREZZO
===================================================== */

function showCoin(
    symbol,
    data
) {


    if (
        !data ||
        !data.quotes ||
        !data.quotes.USD
    ) {

        return false;

    }


    var quote =
        data.quotes.USD;


    var price =
        Number(
            quote.price
        );


    var change =
        Number(
            quote.percent_change_24h
        );


    if (
        isNaN(price)
    ) {

        return false;

    }


    var priceId;

    var changeId;


    if (
        symbol == "helium"
    ) {

        priceId =
            "helium";

        changeId =
            "helium-change";

    }
    else {

        priceId =
            symbol;

        changeId =
            symbol +
            "-change";

    }


    var priceElement =
        document.getElementById(
            priceId
        );


    var changeElement =
        document.getElementById(
            changeId
        );


    if (
        priceElement
    ) {

        priceElement.innerHTML =
            formatPrice(
                price
            );

    }


    if (
        changeElement &&
        !isNaN(change)
    ) {


        changeElement.innerHTML =

            (
                change >= 0
                ? "▲ "
                : "▼ "
            ) +

            Math.abs(
                change
            ).toFixed(2) +

            "%";


        if (
            symbol == "helium"
        ) {

            changeElement.className =

                "hnt-change " +

                (
                    change >= 0
                    ? "up"
                    : "down"
                );

        }
        else {

            changeElement.className =

                "change " +

                (
                    change >= 0
                    ? "up"
                    : "down"
                );

        }

    }


    return true;

}



/* =====================================================
   AGGIORNA PREZZI
===================================================== */

function updatePrices() {


    var symbols = [

        "bitcoin",
        "ethereum",
        "solana",
        "helium"

    ];


    var completed = 0;

    var valid = 0;


    function finished() {


        completed++;


        if (
            completed >=
            symbols.length
        ) {


            if (
                valid > 0
            ) {


                document.getElementById(
                    "status"
                ).className =
                    "status";


                document.getElementById(
                    "updated"
                ).innerHTML =

                    '<span class="status"></span>' +

                    valid +
                    "/4 crypto · " +

                    new Date()
                    .toLocaleTimeString(
                        "it-IT"
                    ) +

                    " · CoinPaprika";

            }
            else {


                document.getElementById(
                    "status"
                ).className =
                    "status old";


                document.getElementById(
                    "updated"
                ).innerHTML =

                    '<span class="status old"></span>' +

                    "Connessione non disponibile";

            }

        }

    }


    function loadCoin(
        index
    ) {


        if (
            index >=
            symbols.length
        ) {

            return;

        }


        var symbol =
            symbols[index];


        getCoin(

            symbol,

            function(
                returnedSymbol,
                data
            ) {


                if (
                    showCoin(
                        returnedSymbol,
                        data
                    )
                ) {

                    valid++;

                }


                finished();


                setTimeout(

                    function() {

                        loadCoin(
                            index + 1
                        );

                    },

                    500

                );

            }

        );

    }


    loadCoin(0);

}



/* =====================================================
   GRAFICO HNT
===================================================== */

function updateHntChart() {


    var xhr =
        new XMLHttpRequest();


    /*
       Usiamo l'endpoint storico
       di CoinPaprika.
    */

    var url =

        "https://api.coinpaprika.com/v1/tickers/" +

        COIN_IDS.helium +

        "/historical" +

        "?start=2026-08-30T00:00:00Z" +

        "&end=2026-08-31T23:59:59Z" +

        "&interval=1h" +

        "&quote=usd";


    xhr.open(
        "GET",
        url,
        true
    );


    xhr.onreadystatechange =
        function() {


            if (
                xhr.readyState != 4
            ) {

                return;

            }


            if (
                xhr.status != 200
            ) {

                document.getElementById(
                    "chartResult"
                ).innerHTML =
                    "NO DATA";

                return;

            }


            try {


                var data =
                    JSON.parse(
                        xhr.responseText
                    );


                if (
                    !data ||
                    data.length < 2
                ) {

                    return;

                }


                var points = [];


                var i;


                for (
                    i = 0;
                    i < data.length;
                    i++
                ) {


                    if (
                        data[i].price !== undefined
                    ) {


                        points.push({

                            time:
                                new Date(
                                    data[i].timestamp
                                ).getTime(),

                            close:
                                Number(
                                    data[i].price
                                )

                        });

                    }

                }


                if (
                    points.length >= 2
                ) {

                    drawTrend(
                        points
                    );

                }

            }
            catch (e) {

                document.getElementById(
                    "chartResult"
                ).innerHTML =
                    "CHART ERROR";

            }

        };


    xhr.onerror =
        function() {

            document.getElementById(
                "chartResult"
            ).innerHTML =
                "NO CONNECTION";

        };


    xhr.send(null);

}



/* =====================================================
   DISEGNA GRAFICO
===================================================== */

function drawTrend(
    points
) {


    var canvas =
        document.getElementById(
            "hntChart"
        );


    var width =
        canvas.clientWidth;


    var height =
        canvas.clientHeight;


    if (
        width <= 0 ||
        height <= 0
    ) {

        return;

    }


    /*
       Alcuni vecchi browser Tizen
       gestiscono meglio una dimensione
       fissa del canvas.
    */

    canvas.width =
        width;

    canvas.height =
        height;


    var ctx =
        canvas.getContext(
            "2d"
        );


    var left = 8;

    var right = 62;

    var top = 10;

    var bottom = 20;


    var chartWidth =
        width -
        left -
        right;


    var chartHeight =
        height -
        top -
        bottom;


    var values = [];


    var i;


    for (
        i = 0;
        i < points.length;
        i++
    ) {

        values.push(
            points[i].close
        );

    }


    var min =
        Math.min.apply(
            null,
            values
        );


    var max =
        Math.max.apply(
            null,
            values
        );


    var range =
        max - min;


    if (
        range <= 0
    ) {

        range =
            max * 0.01;

    }


    min -=
        range * 0.08;


    max +=
        range * 0.08;


    function priceY(
        price
    ) {

        return top +

            (
                (max - price) /
                (max - min)
            ) *

            chartHeight;

    }


    function priceX(
        index
    ) {

        if (
            values.length <= 1
        ) {

            return left +
                chartWidth / 2;

        }


        return left +

            (
                index /
                (values.length - 1)
            ) *

            chartWidth;

    }


    /*
       Sfondo.
    */

    ctx.fillStyle =
        "#0b0b0b";


    ctx.fillRect(

        0,
        0,
        width,
        height

    );


    /*
       Griglia.
    */

    ctx.font =
        "11px Arial";


    for (
        i = 0;
        i <= 5;
        i++
    ) {


        var gy =
            top +

            (
                i /
                5
            ) *

            chartHeight;


        ctx.strokeStyle =
            "rgba(255,255,255,0.07)";


        ctx.lineWidth = 1;


        ctx.beginPath();


        ctx.moveTo(
            left,
            gy
        );


        ctx.lineTo(

            left +
            chartWidth,

            gy

        );


        ctx.stroke();


        var gridPrice =

            max -

            (
                i /
                5
            ) *

            (
                max - min
            );


        ctx.fillStyle =
            "#777";


        ctx.fillText(

            "$" +
            gridPrice.toFixed(3),

            width -
            right +
            7,

            gy + 4

        );

    }


    /*
       Linea separatrice.
    */

    ctx.strokeStyle =
        "rgba(255,255,255,0.13)";


    ctx.beginPath();


    ctx.moveTo(

        left +
        chartWidth,

        top

    );


    ctx.lineTo(

        left +
        chartWidth,

        height -
        bottom

    );


    ctx.stroke();



    /*
       Colore.
    */

    var firstPrice =
        values[0];


    var lastPrice =
        values[
            values.length - 1
        ];


    var trendColor =

        lastPrice >= firstPrice

        ? "#00d084"

        : "#ff4d4d";



    /*
       Area.
    */

    ctx.beginPath();


    for (
        i = 0;
        i < points.length;
        i++
    ) {


        var x =
            priceX(i);


        var y =
            priceY(
                points[i].close
            );


        if (
            i == 0
        ) {

            ctx.moveTo(
                x,
                y
            );

        }
        else {

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.lineTo(

        left +
        chartWidth,

        height -
        bottom

    );


    ctx.lineTo(

        left,

        height -
        bottom

    );


    ctx.closePath();


    if (
        lastPrice >= firstPrice
    ) {

        ctx.fillStyle =
            "rgba(0,208,132,0.12)";

    }
    else {

        ctx.fillStyle =
            "rgba(255,77,77,0.12)";

    }


    ctx.fill();



    /*
       Linea principale.
    */

    ctx.beginPath();


    for (
        i = 0;
        i < points.length;
        i++
    ) {


        x =
            priceX(i);


        y =
            priceY(
                points[i].close
            );


        if (
            i == 0
        ) {

            ctx.moveTo(
                x,
                y
            );

        }
        else {

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.strokeStyle =
        trendColor;


    ctx.lineWidth = 3;


    ctx.stroke();



    /*
       Ultimo punto.
    */

    var lastX =
        priceX(
            values.length - 1
        );


    var lastY =
        priceY(
            lastPrice
        );


    ctx.beginPath();


    ctx.arc(

        lastX,
        lastY,
        4,
        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        trendColor;


    ctx.fill();



    /*
       Linea orizzontale.
    */

    ctx.strokeStyle =
        trendColor;


    ctx.lineWidth = 1;


    ctx.setLineDash(
        [4, 4]
    );


    ctx.beginPath();


    ctx.moveTo(
        left,
        lastY
    );


    ctx.lineTo(

        left +
        chartWidth,

        lastY

    );


    ctx.stroke();


    ctx.setLineDash([]);



    /*
       Box prezzo.
    */

    ctx.fillStyle =
        trendColor;


    ctx.fillRect(

        width -
        right +
        3,

        lastY - 10,

        right - 5,

        20

    );


    ctx.fillStyle =
        "#050505";


    ctx.font =
        "bold 11px Arial";


    ctx.fillText(

        "$" +
        lastPrice.toFixed(3),

        width -
        right +
        7,

        lastY + 4

    );



    /*
       Variazione 24H.
    */

    var change =

        (
            (
                lastPrice -
                firstPrice
            ) /
            firstPrice
        ) *
        100;


    var result =
        document.getElementById(
            "chartResult"
        );


    result.innerHTML =

        (
            change >= 0
            ? "+"
            : ""
        ) +

        change.toFixed(2) +

        "%";


    result.style.color =
        trendColor;

}



/* =====================================================
   AVVIO
===================================================== */

updatePrices();

updateHntChart();


setInterval(

    updatePrices,

    PRICE_REFRESH

);


setInterval(

    updateHntChart,

    CHART_REFRESH

);


window.onresize =
    function() {

        updateHntChart();

    };

</script>
