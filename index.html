<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: white;
    font-family: Arial;
}

body {
    padding: 30px;
}

h1 {
    text-align: center;
}

.row {
    width: 100%;
    height: 180px;
    white-space: nowrap;
}

.box {
    display: inline-block;
    vertical-align: top;

    width: 30%;

    height: 150px;

    margin-right: 2%;

    background: #151515;

    border: 2px solid #333;

    border-radius: 15px;

    text-align: center;

    padding-top: 20px;

    font-size: 30px;
}

.box:last-child {
    margin-right: 0;
}

.green {
    color: #00d084;
}

</style>

</head>

<body>

<h1>LAYOUT TEST</h1>

<div class="row">

    <div class="box">
        BTC
        <br>
        <span class="green">$100000</span>
    </div>

    <div class="box">
        ETH
        <br>
        <span class="green">$4000</span>
    </div>

    <div class="box">
        SOL
        <br>
        <span class="green">$200</span>
    </div>

</div>

</body>
</html>
