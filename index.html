<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WeRide WRD Test</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050505;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {

    width: 700px;
    max-width: 92vw;

    background: linear-gradient(
        145deg,
        #151515,
        #0d0d0d
    );

    border: 2px solid #292929;

    border-radius: 20px;

    padding: 25px;

    box-shadow:
        0 4px 25px
        rgba(0,0,0,0.45);

}

.header {

    display: flex;
    align-items: center;

    margin-bottom: 20px;

}

.logo {

    width: 55px;
    height: 55px;

    margin-right: 15px;

}

.title {

    font-size: 30px;
    font-weight: bold;

}

.subtitle {

    color: #777;

    font-size: 14px;

    margin-top: 4px;

}

.widget {

    width: 100%;
    height: 220px;

    overflow: hidden;

}

.status {

    text-align: center;

    color: #777;

    font-size: 13px;

    margin-top: 12px;

}

</style>

</head>


<body>


<div class="card">


    <div class="header">


        <svg
            class="logo"
            viewBox="0 0 100 100"
            xmlns="http://www.w3.org/2000/svg">

            <rect
                width="100"
                height="100"
                rx="20"
                fill="#ffffff"/>

            <circle
                cx="50"
                cy="50"
                r="37"
                fill="#111111"/>

            <path
                d="M26 53 L36 53 L43 34 L51 66 L60 42 L67 53 L75 53"
                fill="none"
                stroke="#ffffff"
                stroke-width="6"
                stroke-linecap="round"
                stroke-linejoin="round"/>

        </svg>


        <div>

            <div class="title">
                WeRide · WRD
            </div>

            <div class="subtitle">
                NASDAQ · USD · TradingView
            </div>

        </div>


    </div>


    <div class="widget">


        <div
            class="tradingview-widget-container"
            style="width:100%; height:100%;">

            <div
                class="tradingview-widget-container__widget"
                style="width:100%; height:100%;">
            </div>


            <script
                type="text/javascript"
                src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js"
                async>

                {
                    "symbol": "NASDAQ:WRD",
                    "width": "100%",
                    "height": "220",
                    "locale": "en",
                    "dateRange": "1D",
                    "colorTheme": "dark",
                    "isTransparent": false,
                    "autosize": false,
                    "largeChartUrl": ""
                }

            </script>


        </div>


    </div>


    <div class="status">

        WRD · dati forniti da TradingView

    </div>


</div>


</body>

</html>
