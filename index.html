<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEST WRD</title>

<style>
body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    padding-top: 100px;
}

h1 {
    font-size: 32px;
    letter-spacing: 5px;
}

#price {
    font-size: 60px;
    font-weight: bold;
    color: #00d084;
    margin-top: 30px;
}

#status {
    color: #777;
    margin-top: 20px;
}
</style>

</head>

<body>

<h1>WeRide · WRD</h1>

<div id="price">CARICAMENTO...</div>

<div id="status">
    Connessione...
</div>

<script>

function getWeRidePrice() {

    var xhr = new XMLHttpRequest();

    /*
       Yahoo Finance
       WeRide = WRD
       NASDAQ
    */

    var url =
        "https://query1.finance.yahoo.com/v8/finance/chart/WRD?range=1d&interval=1m";

    xhr.open(
        "GET",
        url,
        true
    );

    xhr.onreadystatechange = function() {

        if (xhr.readyState !== 4) {
            return;
        }

        if (xhr.status === 200) {

            try {

                var data =
                    JSON.parse(
                        xhr.responseText
                    );

                var result =
                    data.chart.result[0];

                var meta =
                    result.meta;

                var price =
                    meta.regularMarketPrice;

                if (
                    price === undefined ||
                    price === null
                ) {

                    document.getElementById(
                        "price"
                    ).innerHTML =
                        "PREZZO NON DISPONIBILE";

                    return;
                }

                document.getElementById(
                    "price"
                ).innerHTML =
                    "$ " +
                    Number(price).toFixed(2);

                document.getElementById(
                    "status"
                ).innerHTML =
                    "WRD · NASDAQ · " +
                    new Date().toLocaleTimeString("it-IT");

            }
            catch (e) {

                document.getElementById(
                    "price"
                ).innerHTML =
                    "ERRORE DATI";

                document.getElementById(
                    "status"
                ).innerHTML =
                    e.message;

            }

        }
        else {

            document.getElementById(
                "price"
            ).innerHTML =
                "ERRORE " +
                xhr.status;

            document.getElementById(
                "status"
            ).innerHTML =
                "Impossibile leggere WRD";

        }

    };

    xhr.onerror = function() {

        document.getElementById(
            "price"
        ).innerHTML =
            "ERRORE RETE";

        document.getElementById(
            "status"
        ).innerHTML =
            "Connessione API fallita";

    };

    xhr.send(null);
}


/* Prima richiesta */

getWeRidePrice();


/* Aggiornamento ogni 90 secondi */

setInterval(
    getWeRidePrice,
    90000
);

</script>

</body>

</html>
