/* =====================================================

}

<script>

/* =====================================================
   CONFIGURAZIONE
===================================================== */

var PRICE_REFRESH = 300000;

var CHART_REFRESH = 300000;


/* CoinPaprika */

var COINS = {

    bitcoin:
        "btc-bitcoin",

    ethereum:
        "eth-ethereum",

    solana:
        "sol-solana",

    helium:
        "hnt-helium"

};



/* =====================================================
   FORMATTA PREZZO
===================================================== */

function formatPrice(
    price
) {


    if (
        price === null ||
        price === undefined ||
        isNaN(price)
    ) {

        return "---";

    }


    var decimals = 2;


    if (
        price < 1
    ) {

        decimals = 4;

    }


    if (
        price < 0.01
    ) {

        decimals = 6;

    }


    return "$ " +
        Number(price)
        .toFixed(decimals);

}



/* =====================================================
   RICHIESTA PREZZO
===================================================== */

function requestCoin(
    name,
    callback
) {


    var xhr =
        new XMLHttpRequest();


    var url =

        "https://api.coinpaprika.com/v1/tickers/" +

        COINS[name];


    xhr.open(
        "GET",
        url,
        true
    );


    xhr.onreadystatechange =
        function() {


            if (
                xhr.readyState != 4
            ) {

                return;

            }


            if (
                xhr.status == 200
            ) {


                try {


                    var data =
                        JSON.parse(
                            xhr.responseText
                        );


                    callback(
                        name,
                        data
                    );


                }
                catch (e) {


                    callback(
                        name,
                        null
                    );


                }

            }
            else {


                callback(
                    name,
                    null
                );

            }

        };


    xhr.onerror =
        function() {

            callback(
                name,
                null
            );

        };


    xhr.send(null);

}



/* =====================================================
   MOSTRA PREZZO
===================================================== */

function displayCoin(
    name,
    data
) {


    if (
        !data ||
        !data.quotes ||
        !data.quotes.USD
    ) {

        return false;

    }


    var usd =
        data.quotes.USD;


    var price =
        Number(
            usd.price
        );


    var change =
        Number(
            usd.percent_change_24h
        );


    if (
        isNaN(price)
    ) {

        return false;

    }


    var priceId =
        name;


    var changeId =
        name +
        "-change";


    if (
        name == "helium"
    ) {

        priceId =
            "helium";

        changeId =
            "helium-change";

    }


    var priceElement =
        document.getElementById(
            priceId
        );


    var changeElement =
        document.getElementById(
            changeId
        );


    if (
        priceElement
    ) {

        priceElement.innerHTML =
            formatPrice(
                price
            );

    }


    if (
        changeElement &&
        !isNaN(change)
    ) {


        var arrow =
            change >= 0
            ? "▲ "
            : "▼ ";


        changeElement.innerHTML =

            arrow +

            Math.abs(
                change
            ).toFixed(2) +

            "%";


        if (
            name == "helium"
        ) {

            changeElement.className =

                "hnt-change " +

                (
                    change >= 0
                    ? "up"
                    : "down"
                );

        }
        else {

            changeElement.className =

                "change " +

                (
                    change >= 0
                    ? "up"
                    : "down"
                );

        }

    }


    return true;

}



/* =====================================================
   AGGIORNA PREZZI
===================================================== */

function updatePrices() {


    var names = [

        "bitcoin",
        "ethereum",
        "solana",
        "helium"

    ];


    var completed = 0;

    var valid = 0;


    function complete() {


        completed++;


        if (
            completed >=
            names.length
        ) {


            if (
                valid > 0
            ) {


                document.getElementById(
                    "status"
                ).className =
                    "status";


                document.getElementById(
                    "updated"
                ).innerHTML =

                    '<span class="status"></span>' +

                    valid +
                    "/4 crypto · " +

                    new Date()
                    .toLocaleTimeString(
                        "it-IT"
                    ) +

                    " · CoinPaprika";


            }
            else {


                document.getElementById(
                    "status"
                ).className =
                    "status old";


                document.getElementById(
                    "updated"
                ).innerHTML =

                    '<span class="status old"></span>' +

                    "Connessione non disponibile";

            }

        }

    }


    function next(
        index
    ) {


        if (
            index >=
            names.length
        ) {

            return;

        }


        var name =
            names[index];


        requestCoin(

            name,

            function(
                returnedName,
                data
            ) {


                if (
                    displayCoin(
                        returnedName,
                        data
                    )
                ) {

                    valid++;

                }


                complete();


                setTimeout(

                    function() {

                        next(
                            index + 1
                        );

                    },

                    500

                );

            }

        );

    }


    next(0);

}



/* =====================================================
   GRAFICO HNT
===================================================== */

function updateHntChart() {


    /*
       CoinPaprika fornisce lo storico
       tramite questo endpoint.

       Usiamo gli ultimi 24 punti
       disponibili.
    */


    var xhr =
        new XMLHttpRequest();


    var url =

        "https://api.coinpaprika.com/v1/tickers/" +

        COINS.helium +

        "/historical" +

        "?start=2026-08-30T00:00:00Z" +

        "&end=2026-08-31T23:59:59Z" +

        "&interval=1h";


    xhr.open(
        "GET",
        url,
        true
    );


    xhr.onreadystatechange =
        function() {


            if (
                xhr.readyState != 4
            ) {

                return;

            }


            if (
                xhr.status != 200
            ) {


                document.getElementById(
                    "chartResult"
                ).innerHTML =
                    "NO DATA";


                return;

            }


            try {


                var data =
                    JSON.parse(
                        xhr.responseText
                    );


                if (
                    !data ||
                    data.length < 2
                ) {


                    document.getElementById(
                        "chartResult"
                    ).innerHTML =
                        "NO DATA";


                    return;

                }


                var points = [];


                var i;


                for (
                    i = 0;
                    i < data.length;
                    i++
                ) {


                    var price = 0;


                    /*
                       CoinPaprika normalmente
                       restituisce price.
                    */

                    if (
                        data[i].price !== undefined
                    ) {

                        price =
                            Number(
                                data[i].price
                            );

                    }


                    /*
                       Compatibilità nel caso
                       venga restituito quotes.
                    */

                    if (
                        (
                            isNaN(price) ||
                            price <= 0
                        ) &&

                        data[i].quotes &&

                        data[i].quotes.USD
                    ) {

                        price =
                            Number(
                                data[i]
                                .quotes
                                .USD
                                .price
                            );

                    }


                    if (
                        !isNaN(price) &&
                        price > 0
                    ) {


                        points.push({

                            time:
                                new Date(
                                    data[i]
                                    .timestamp
                                ).getTime(),

                            price:
                                price

                        });

                    }

                }


                if (
                    points.length >= 2
                ) {


                    drawChart(
                        points
                    );


                }
                else {


                    document.getElementById(
                        "chartResult"
                    ).innerHTML =
                        "NO DATA";

                }


            }
            catch (e) {


                document.getElementById(
                    "chartResult"
                ).innerHTML =
                    "ERROR";

            }

        };


    xhr.onerror =
        function() {


            document.getElementById(
                "chartResult"
            ).innerHTML =
                "OFFLINE";

        };


    xhr.send(null);

}



/* =====================================================
   DISEGNA GRAFICO
===================================================== */

function drawChart(
    points
) {


    var canvas =
        document.getElementById(
            "hntChart"
        );


    var width =
        canvas.clientWidth;


    var height =
        canvas.clientHeight;


    if (
        width < 50 ||
        height < 50
    ) {

        return;

    }


    canvas.width =
        width;


    canvas.height =
        height;


    var ctx =
        canvas.getContext(
            "2d"
        );


    var left = 8;

    var right = 62;

    var top = 8;

    var bottom = 20;


    var chartWidth =
        width -
        left -
        right;


    var chartHeight =
        height -
        top -
        bottom;


    var values = [];


    var i;


    for (
        i = 0;
        i < points.length;
        i++
    ) {

        values.push(
            points[i].price
        );

    }


    var min =
        Math.min.apply(
            null,
            values
        );


    var max =
        Math.max.apply(
            null,
            values
        );


    var range =
        max - min;


    if (
        range <= 0
    ) {

        range =
            max * 0.01;

    }


    min -=
        range * 0.08;


    max +=
        range * 0.08;


    function xPosition(
        index
    ) {

        return left +

            (
                index /
                (values.length - 1)
            ) *

            chartWidth;

    }


    function yPosition(
        price
    ) {

        return top +

            (
                (max - price) /
                (max - min)
            ) *

            chartHeight;

    }


    /*
       Sfondo.
    */

    ctx.fillStyle =
        "#0b0b0b";


    ctx.fillRect(

        0,
        0,
        width,
        height

    );


    /*
       Griglia.
    */

    ctx.font =
        "11px Arial";


    for (
        i = 0;
        i <= 5;
        i++
    ) {


        var gy =

            top +

            (
                i /
                5
            ) *

            chartHeight;


        ctx.strokeStyle =
            "rgba(255,255,255,0.07)";


        ctx.lineWidth = 1;


        ctx.beginPath();


        ctx.moveTo(
            left,
            gy
        );


        ctx.lineTo(

            left +
            chartWidth,

            gy

        );


        ctx.stroke();


        var gridPrice =

            max -

            (
                i /
                5
            ) *

            (
                max - min
            );


        ctx.fillStyle =
            "#777";


        ctx.fillText(

            "$" +
            gridPrice.toFixed(3),

            width -
            right +
            6,

            gy + 4

        );

    }


    /*
       Separatore scala.
    */

    ctx.strokeStyle =
        "rgba(255,255,255,0.15)";


    ctx.beginPath();


    ctx.moveTo(

        left +
        chartWidth,

        top

    );


    ctx.lineTo(

        left +
        chartWidth,

        height -
        bottom

    );


    ctx.stroke();



    /*
       Colore.
    */

    var firstPrice =
        values[0];


    var lastPrice =
        values[
            values.length - 1
        ];


    var color =

        lastPrice >= firstPrice

        ? "#00d084"

        : "#ff4d4d";


    /*
       Area sotto la linea.
    */

    ctx.beginPath();


    for (
        i = 0;
        i < values.length;
        i++
    ) {


        var px =
            xPosition(i);


        var py =
            yPosition(
                values[i]
            );


        if (
            i == 0
        ) {

            ctx.moveTo(
                px,
                py
            );

        }
        else {

            ctx.lineTo(
                px,
                py
            );

        }

    }


    ctx.lineTo(

        left +
        chartWidth,

        height -
        bottom

    );


    ctx.lineTo(

        left,

        height -
        bottom

    );


    ctx.closePath();


    if (
        lastPrice >= firstPrice
    ) {

        ctx.fillStyle =
            "rgba(0,208,132,0.12)";

    }
    else {

        ctx.fillStyle =
            "rgba(255,77,77,0.12)";

    }


    ctx.fill();



    /*
       Linea.
    */

    ctx.beginPath();


    for (
        i = 0;
        i < values.length;
        i++
    ) {


        px =
            xPosition(i);


        py =
            yPosition(
                values[i]
            );


        if (
            i == 0
        ) {

            ctx.moveTo(
                px,
                py
            );

        }
        else {

            ctx.lineTo(
                px,
                py
            );

        }

    }


    ctx.strokeStyle =
        color;


    ctx.lineWidth = 3;


    ctx.lineJoin =
        "round";


    ctx.lineCap =
        "round";


    ctx.stroke();



    /*
       Ultimo punto.
    */

    var lastX =
        xPosition(
            values.length - 1
        );


    var lastY =
        yPosition(
            lastPrice
        );


    ctx.beginPath();


    ctx.arc(

        lastX,
        lastY,
        4,
        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        color;


    ctx.fill();



    /*
       Linea prezzo.
    */

    ctx.strokeStyle =
        color;


    ctx.lineWidth = 1;


    ctx.setLineDash(
        [4,4]
    );


    ctx.beginPath();


    ctx.moveTo(
        left,
        lastY
    );


    ctx.lineTo(

        left +
        chartWidth,

        lastY

    );


    ctx.stroke();


    ctx.setLineDash([]);



    /*
       Box prezzo.
    */

    ctx.fillStyle =
        color;


    ctx.fillRect(

        width -
        right +
        2,

        lastY - 10,

        right - 4,

        20

    );


    ctx.fillStyle =
        "#050505";


    ctx.font =
        "bold 11px Arial";


    ctx.fillText(

        "$" +
        lastPrice.toFixed(3),

        width -
        right +
        6,

        lastY + 4

    );



    /*
       Variazione.
    */

    var change =

        (
            (
                lastPrice -
                firstPrice
            ) /
            firstPrice
        ) *
        100;


    var result =
        document.getElementById(
            "chartResult"
        );


    result.innerHTML =

        (
            change >= 0
            ? "+"
            : ""
        ) +

        change.toFixed(2) +

        "%";


    result.style.color =
        color;



    /*
       Orari.
    */

    ctx.fillStyle =
        "#555";


    ctx.font =
        "10px Arial";


    var firstDate =
        new Date(
            points[0].time
        );


    var lastDate =
        new Date(
            points[
                points.length - 1
            ].time
        );


    var firstText =

        firstDate
        .toLocaleTimeString(

            "it-IT",

            {
                hour: "2-digit",
                minute: "2-digit"
            }

        );


    var lastText =

        lastDate
        .toLocaleTimeString(

            "it-IT",

            {
                hour: "2-digit",
                minute: "2-digit"
            }

        );


    ctx.fillText(

        firstText,

        left,

        height - 5

    );


    var textWidth =
        ctx.measureText(
            lastText
        ).width;


    ctx.fillText(

        lastText,

        left +
        chartWidth -
        textWidth,

        height - 5

    );

}



/* =====================================================
   AVVIO
===================================================== */

updatePrices();

updateHntChart();


/*
   Prezzi ogni 5 minuti.
*/

setInterval(

    updatePrices,

    PRICE_REFRESH

);


/*
   Grafico ogni 5 minuti.
*/

setInterval(

    updateHntChart,

    CHART_REFRESH

);

</script>
