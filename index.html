<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TEST CRYPTO</title>

<style>
body {
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
    padding-top: 80px;
}

h1 {
    font-size: 40px;
}

#result {
    font-size: 45px;
    color: #00d084;
    margin-top: 40px;
}
</style>

</head>

<body>

<h1>TEST BTC</h1>

<div id="result">
CARICAMENTO...
</div>

<script>

var result = document.getElementById("result");

var request = new XMLHttpRequest();

request.open(
    "GET",
    "https://api.coinpaprika.com/v1/tickers/btc-bitcoin",
    true
);

request.onreadystatechange = function() {

    if (request.readyState !== 4) {
        return;
    }

    if (request.status === 200) {

        try {

            var data =
                JSON.parse(request.responseText);

            var price =
                data.quotes.USD.price;

            result.innerHTML =
                "$ " +
                Number(price).toFixed(2);

        }
        catch (e) {

            result.innerHTML =
                "ERRORE JSON";

        }

    }
    else {

        result.innerHTML =
            "ERRORE HTTP " +
            request.status;

    }

};

request.onerror = function() {

    result.innerHTML =
        "ERRORE CONNESSIONE";

};

request.send();

</script>

</body>
</html>
