<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TEST WRD</title>

<style>

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    padding-top: 100px;
}

h1 {
    font-size: 34px;
    letter-spacing: 5px;
}

#price {
    margin-top: 35px;
    font-size: 65px;
    font-weight: bold;
    color: #00d084;
}

#change {
    margin-top: 12px;
    font-size: 25px;
    font-weight: bold;
}

#status {
    margin-top: 25px;
    color: #777;
    font-size: 15px;
}

.up {
    color: #00d084;
}

.down {
    color: #ff4d4d;
}

</style>

</head>

<body>

<h1>WeRide · WRD</h1>

<div id="price">
    CARICAMENTO...
</div>

<div id="change">
    ---
</div>

<div id="status">
    Connessione...
</div>


<script>

function loadWRD() {

    var xhr =
        new XMLHttpRequest();

    /*
       StockAnalysis pagina WRD.
       Proviamo a leggere la pagina tramite
       r.jina.ai, che restituisce il contenuto
       testuale della pagina.
    */

    var url =
        "https://r.jina.ai/https://stockanalysis.com/stocks/wrd/";

    xhr.open(
        "GET",
        url,
        true
    );

    xhr.onreadystatechange =
        function() {

            if (
                xhr.readyState !== 4
            ) {
                return;
            }

            if (
                xhr.status !== 200
            ) {

                document.getElementById(
                    "price"
                ).innerHTML =
                    "ERRORE " +
                    xhr.status;

                document.getElementById(
                    "status"
                ).innerHTML =
                    "Richiesta fallita";

                return;
            }


            try {

                var text =
                    xhr.responseText;

                console.log(
                    text
                );


                /*
                   Cerchiamo:

                   # WeRide Inc. (WRD)

                   e il prezzo che segue
                */


                var match =
                    text.match(
                        /(?:Real-Time Price|Price)[\s\S]{0,150}?(\d+\.\d{2})/
                    );


                /*
                   Fallback:
                   cerchiamo direttamente
                   il primo prezzo con due decimali
                */

                if (
                    !match
                ) {

                    match =
                        text.match(
                            /\b(\d+\.\d{2})\b/
                        );

                }


                if (
                    match &&
                    match[1]
                ) {

                    var price =
                        Number(
                            match[1]
                        );


                    document.getElementById(
                        "price"
                    ).innerHTML =
                        "$ " +
                        price.toFixed(2);


                    document.getElementById(
                        "status"
                    ).innerHTML =
                        "WRD · NASDAQ · " +
                        new Date()
                        .toLocaleTimeString(
                            "it-IT"
                        );

                }
                else {

                    document.getElementById(
                        "price"
                    ).innerHTML =
                        "NO DATA";

                    document.getElementById(
                        "status"
                    ).innerHTML =
                        "Prezzo WRD non trovato";

                }

            }
            catch (e) {

                document.getElementById(
                    "price"
                ).innerHTML =
                    "ERRORE";

                document.getElementById(
                    "status"
                ).innerHTML =
                    e.message;

            }

        };


    xhr.onerror =
        function() {

            document.getElementById(
                "price"
            ).innerHTML =
                "ERRORE RETE";

            document.getElementById(
                "status"
            ).innerHTML =
                "Connessione fallita";

        };


    xhr.send(null);

}


/*
   TEST IMMEDIATO
*/

loadWRD();


/*
   Aggiornamento ogni 90 secondi
*/

setInterval(
    loadWRD,
    90000
);

</script>

</body>

</html>
