<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Market Dashboard</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #050505;
    color: #ffffff;

    font-family: Arial, Helvetica, sans-serif;

    overflow: hidden;
}


body {

    padding:
        24px
        8vw
        15px
        8vw;
}


/* =====================================================
   TITOLO
===================================================== */

h1 {

    text-align: center;

    font-size: 34px;

    letter-spacing: 6px;

    margin:
        0 0 17px 0;
}


/* =====================================================
   TITOLI SEZIONI
===================================================== */

.section-title {

    color: #777777;

    font-size: 18px;

    letter-spacing: 4px;

    border-bottom:
        1px solid #292929;

    padding-bottom: 7px;

    margin-bottom: 12px;
}


/* =====================================================
   BTC ETH SOL
===================================================== */

.crypto-top {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 16px;

    width: 100%;
}


.crypto-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    min-height: 145px;

    padding:
        15px 20px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);
}


.token-header {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 11px;
}


.logo {

    width: 42px;
    height: 42px;

    object-fit: contain;

    border-radius: 50%;
}


.symbol {

    font-size: 27px;

    font-weight: bold;
}


.price {

    margin-top: 7px;

    font-size: 37px;

    font-weight: bold;

    white-space: nowrap;

    text-align: center;
}


.change {

    margin-top: 5px;

    font-size: 18px;

    font-weight: bold;
}


.up {

    color: #00d084;
}


.down {

    color: #ff4d4d;
}


/* =====================================================
   HNT + GRAFICO
===================================================== */

.hnt-row {

    display: grid;

    grid-template-columns:
        0.62fr
        1.38fr;

    gap: 16px;

    width: 100%;

    margin-top: 16px;
}


/* =====================================================
   HNT CARD
===================================================== */

.hnt-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    min-height: 235px;

    padding: 18px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);
}


.hnt-header {

    display: flex;

    align-items: center;

    gap: 10px;
}


.hnt-logo {

    width: 43px;
    height: 43px;

    object-fit: contain;

    border-radius: 50%;
}


.hnt-symbol {

    font-size: 28px;

    font-weight: bold;
}


.hnt-price {

    font-size: 44px;

    font-weight: bold;

    margin-top: 7px;

    white-space: nowrap;
}


.hnt-change {

    font-size: 20px;

    font-weight: bold;

    margin-top: 4px;
}


.hnt-label {

    color: #666666;

    font-size: 13px;

    margin-top: 7px;

    letter-spacing: 1px;
}


/* =====================================================
   GRAFICO HNT
===================================================== */

.chart-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    min-height: 235px;

    padding:
        12px
        15px
        10px
        15px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);
}


.chart-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: #888888;

    font-size: 15px;

    letter-spacing: 1px;

    padding:
        0 4px 5px 4px;
}


#chartResult {

    font-weight: bold;
}


.chart-area {

    width: 100%;

    height: 190px;

    position: relative;
}


#hntChart {

    display: block;

    width: 100%;

    height: 190px;
}


/* =====================================================
   STOCK
===================================================== */

.stock-section {

    margin-top: 16px;
}


.stock-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border:
        2px solid #292929;

    border-radius: 17px;

    min-height: 225px;

    padding:
        15px
        22px
        14px
        22px;

    width: 100%;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);

    overflow: hidden;
}


/* =====================================================
   WE RIDE
===================================================== */

.stock-header {

    display: flex;

    align-items: center;

    gap: 14px;

    min-height: 55px;
}


.weride-logo {

    width: 48px;
    height: 48px;

    flex-shrink: 0;
}


.stock-title {

    font-size: 27px;

    font-weight: bold;
}


.stock-subtitle {

    color: #777777;

    font-size: 14px;

    margin-top: 3px;
}


/* =====================================================
   TRADINGVIEW WRD
===================================================== */

.tradingview-wrapper {

    width: 100%;

    height: 145px;

    margin-top: 5px;

    overflow: hidden;
}


.tradingview-widget-container {

    width: 100%;

    height: 145px;
}


.tradingview-widget-container__widget {

    width: 100%;

    height: 145px;
}


/* =====================================================
   STATO
===================================================== */

#updated {

    text-align: center;

    color: #777777;

    font-size: 13px;

    margin-top: 7px;
}


.status {

    display: inline-block;

    width: 8px;
    height: 8px;

    background: #00d084;

    border-radius: 50%;

    margin-right: 5px;
}


.status.old {

    background: #ffb000;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 1100px) {

    body {

        padding-left: 4vw;
        padding-right: 4vw;
    }


    h1 {

        font-size: 27px;
    }


    .price {

        font-size: 30px;
    }


    .hnt-price {

        font-size: 35px;
    }

}


@media (max-width: 750px) {

    body {

        overflow-y: auto;
    }


    .crypto-top {

        grid-template-columns: 1fr;
    }


    .hnt-row {

        grid-template-columns: 1fr;
    }

}

</style>

</head>

<script>

/* =====================================================
   CONFIGURAZIONE
===================================================== */


/*
   CoinPaprika aggiorna il piano gratuito
   mediamente ogni circa 5 minuti.

   Quindi non ha senso interrogare l'API
   ogni pochi secondi.
*/

const PRICE_REFRESH = 300000;


/*
   Grafico HNT:
   aggiornamento ogni 5 minuti.
*/

const CHART_REFRESH = 300000;


/*
   ID CoinPaprika
*/

const coins = {

    bitcoin:
        "btc-bitcoin",

    ethereum:
        "eth-ethereum",

    solana:
        "sol-solana",

    helium:
        "hnt-helium"

};


let lastPrices = {};



/* =====================================================
   FORMATTA PREZZO
===================================================== */

function formatPrice(price) {

    if (
        price === null ||
        price === undefined ||
        isNaN(price)
    ) {

        return "---";

    }


    let decimals = 2;


    if (price < 1) {

        decimals = 4;

    }


    if (price < 0.01) {

        decimals = 6;

    }


    return new Intl.NumberFormat(

        "en-US",

        {

            style: "currency",

            currency: "USD",

            minimumFractionDigits:
                decimals,

            maximumFractionDigits:
                decimals

        }

    ).format(price);

}



/* =====================================================
   AGGIORNA UNA SINGOLA CRYPTO
===================================================== */

async function getCoinData(id) {

    const url =
        "https://api.coinpaprika.com/v1/tickers/" +
        id;


    const response =
        await fetch(

            url,

            {
                cache: "no-store"
            }

        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    return await response.json();

}



/* =====================================================
   AGGIORNA PREZZI
===================================================== */

async function updatePrices() {

    try {

        const ids = Object.keys(coins);

        let valid = 0;


        /*
           Richiediamo le quattro crypto.
        */

        const results =
            await Promise.all(

                ids.map(

                    async function(symbol) {

                        try {

                            const data =
                                await getCoinData(
                                    coins[symbol]
                                );

                            return {
                                symbol:
                                    symbol,
                                data:
                                    data
                            };

                        }
                        catch (error) {

                            console.log(
                                symbol,
                                error
                            );

                            return null;

                        }

                    }

                )

            );



        results.forEach(

            function(result) {


                if (
                    !result ||
                    !result.data ||
                    !result.data.quotes ||
                    !result.data.quotes.USD
                ) {

                    return;

                }


                const symbol =
                    result.symbol;


                const quote =
                    result.data.quotes.USD;


                const price =
                    Number(
                        quote.price
                    );


                const change =
                    Number(
                        quote.percent_change_24h
                    );


                if (
                    isNaN(price)
                ) {

                    return;

                }


                lastPrices[symbol] = {

                    price:
                        price,

                    change:
                        change

                };


                valid++;


                /*
                   Elemento prezzo.
                */

                const priceElement =
                    document.getElementById(
                        symbol === "helium"
                        ? "helium"
                        : symbol
                    );


                if (priceElement) {

                    priceElement.textContent =
                        formatPrice(
                            price
                        );

                }


                /*
                   Elemento variazione.
                */

                const changeElement =
                    document.getElementById(

                        symbol === "helium"

                        ? "helium-change"

                        : symbol +
                          "-change"

                    );


                if (
                    changeElement &&
                    !isNaN(change)
                ) {


                    changeElement.textContent =

                        (
                            change >= 0
                            ? "▲ "
                            : "▼ "
                        ) +

                        Math.abs(
                            change
                        ).toFixed(2) +

                        "%";


                    changeElement.className =

                        symbol === "helium"

                        ? "hnt-change " +
                          (
                              change >= 0
                              ? "up"
                              : "down"
                          )

                        : "change " +
                          (
                              change >= 0
                              ? "up"
                              : "down"
                          );

                }

            }

        );


        /*
           Stato.
        */

        if (valid > 0) {

            document.getElementById(
                "status"
            ).className =
                "status";


            document.getElementById(
                "updated"
            ).innerHTML =

                '<span class="status"></span>' +

                valid +
                "/" +
                ids.length +

                " crypto · " +

                new Date()
                    .toLocaleTimeString(
                        "it-IT"
                    ) +

                " · CoinPaprika";


        }
        else {

            throw new Error(
                "Nessun dato ricevuto"
            );

        }


    }
    catch (error) {


        console.log(
            "CoinPaprika:",
            error
        );


        document.getElementById(
            "status"
        ).className =
            "status old";


        document.getElementById(
            "updated"
        ).innerHTML =

            '<span class="status old"></span>' +

            "Connessione temporaneamente non disponibile";

    }

}



/* =====================================================
   DATI STORICI HNT
===================================================== */

async function updateHntChart() {

    try {


        /*
           CoinPaprika Free permette
           dati storici orari dell'ultimo giorno.

           Usiamo 1h.
        */

        const now =
            new Date();


        const start =
            new Date(
                now.getTime() -
                24 * 60 * 60 * 1000
            );


        const startISO =
            start.toISOString();


        const url =

            "https://api.coinpaprika.com/v1/tickers/" +

            coins.helium +

            "/historical" +

            "?start=" +

            encodeURIComponent(
                startISO
            ) +

            "&end=" +

            encodeURIComponent(
                now.toISOString()
            ) +

            "&interval=1h" +

            "&quote=usd" +

            "&limit=100";


        const response =

            await fetch(

                url,

                {
                    cache: "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                "Chart HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !Array.isArray(result) ||
            result.length < 2
        ) {

            throw new Error(
                "Dati grafico insufficienti"
            );

        }


        /*
           Trasformiamo i dati
           nel formato usato dal grafico.
        */

        const points =
            result.map(

                function(item) {

                    return {

                        time:
                            new Date(
                                item.timestamp
                            ).getTime(),

                        close:
                            Number(
                                item.price
                            )

                    };

                }

            ).filter(

                function(item) {

                    return !isNaN(
                        item.close
                    );

                }

            );


        if (
            points.length >= 2
        ) {

            drawTrend(
                points
            );

        }


    }
    catch (error) {

        console.log(
            "HNT chart:",
            error
        );

    }

}



/* =====================================================
   DISEGNA TREND HNT
===================================================== */

function drawTrend(points) {


    const canvas =
        document.getElementById(
            "hntChart"
        );


    const width =
        canvas.clientWidth;


    const height =
        canvas.clientHeight;


    if (
        width <= 0 ||
        height <= 0
    ) {

        return;

    }


    const ratio =
        window.devicePixelRatio ||
        1;


    canvas.width =
        width * ratio;


    canvas.height =
        height * ratio;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    const left = 8;

    const right = 62;

    const top = 10;

    const bottom = 20;


    const chartWidth =
        width -
        left -
        right;


    const chartHeight =
        height -
        top -
        bottom;


    const values =
        points.map(

            function(point) {

                return point.close;

            }

        );


    let min =
        Math.min(
            ...values
        );


    let max =
        Math.max(
            ...values
        );


    const range =
        max - min ||
        max * 0.01;


    min -=
        range * 0.08;


    max +=
        range * 0.08;


    function priceY(price) {

        return top +

            (
                (max - price) /
                (max - min)
            ) *

            chartHeight;

    }


    function priceX(index) {

        if (
            values.length <= 1
        ) {

            return left +
                chartWidth / 2;

        }


        return left +

            (
                index /
                (values.length - 1)
            ) *

            chartWidth;

    }


    /* =================================================
       SFONDO
    ================================================== */

    ctx.fillStyle =
        "#0b0b0b";


    ctx.fillRect(

        0,
        0,
        width,
        height

    );


    /* =================================================
       GRIGLIA + PREZZI
    ================================================== */

    const gridCount = 5;


    ctx.font =
        "11px Arial";


    for (
        let i = 0;
        i <= gridCount;
        i++
    ) {


        const ratioY =
            i /
            gridCount;


        const y =
            top +
            ratioY *
            chartHeight;


        ctx.strokeStyle =
            "rgba(255,255,255,0.07)";


        ctx.lineWidth = 1;


        ctx.beginPath();


        ctx.moveTo(
            left,
            y
        );


        ctx.lineTo(
            left + chartWidth,
            y
        );


        ctx.stroke();


        const price =
            max -
            ratioY *
            (max - min);


        ctx.fillStyle =
            "#777";


        ctx.fillText(

            "$" +
            price.toFixed(3),

            width -
            right +
            7,

            y + 4

        );

    }


    /* =================================================
       SEPARATORE SCALA
    ================================================== */

    ctx.strokeStyle =
        "rgba(255,255,255,0.13)";


    ctx.beginPath();


    ctx.moveTo(

        left +
        chartWidth +
        1,

        top

    );


    ctx.lineTo(

        left +
        chartWidth +
        1,

        height -
        bottom

    );


    ctx.stroke();



    /* =================================================
       LINEA TREND
    ================================================== */

    const firstPrice =
        values[0];


    const lastPrice =
        values[
            values.length - 1
        ];


    const trendColor =

        lastPrice >= firstPrice

        ? "#00d084"

        : "#ff4d4d";


    /* =================================================
       AREA
    ================================================== */

    const gradient =
        ctx.createLinearGradient(

            0,
            top,
            0,
            height

        );


    if (
        lastPrice >= firstPrice
    ) {

        gradient.addColorStop(
            0,
            "rgba(0,208,132,0.18)"
        );


        gradient.addColorStop(
            1,
            "rgba(0,208,132,0)"
        );

    }
    else {

        gradient.addColorStop(
            0,
            "rgba(255,77,77,0.18)"
        );


        gradient.addColorStop(
            1,
            "rgba(255,77,77,0)"
        );

    }


    ctx.beginPath();


    points.forEach(

        function(point, index) {


            const x =
                priceX(index);


            const y =
                priceY(
                    point.close
                );


            if (
                index === 0
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            }
            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }

    );


    ctx.lineTo(

        left +
        chartWidth,

        height -
        bottom

    );


    ctx.lineTo(

        left,

        height -
        bottom

    );


    ctx.closePath();


    ctx.fillStyle =
        gradient;


    ctx.fill();



    /* =================================================
       LINEA PRINCIPALE
    ================================================== */

    ctx.beginPath();


    points.forEach(

        function(point, index) {


            const x =
                priceX(index);


            const y =
                priceY(
                    point.close
                );


            if (
                index === 0
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            }
            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }

    );


    ctx.strokeStyle =
        trendColor;


    ctx.lineWidth = 3;


    ctx.lineJoin =
        "round";


    ctx.lineCap =
        "round";


    ctx.stroke();



    /* =================================================
       ULTIMO PUNTO
    ================================================== */

    const lastX =
        priceX(
            values.length - 1
        );


    const lastY =
        priceY(
            lastPrice
        );


    ctx.beginPath();


    ctx.arc(

        lastX,
        lastY,
        4,
        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        trendColor;


    ctx.fill();



    /* =================================================
       LINEA PREZZO ATTUALE
    ================================================== */

    ctx.strokeStyle =
        trendColor;


    ctx.lineWidth = 1;


    ctx.setLineDash(
        [4, 4]
    );


    ctx.beginPath();


    ctx.moveTo(
        left,
        lastY
    );


    ctx.lineTo(
        left + chartWidth,
        lastY
    );


    ctx.stroke();


    ctx.setLineDash([]);



    /* =================================================
       BOX ULTIMO PREZZO
    ================================================== */

    ctx.fillStyle =
        trendColor;


    ctx.fillRect(

        width -
        right +
        3,

        lastY - 10,

        right - 5,

        20

    );


    ctx.fillStyle =
        "#050505";


    ctx.font =
        "bold 11px Arial";


    ctx.fillText(

        "$" +
        lastPrice.toFixed(3),

        width -
        right +
        7,

        lastY + 4

    );



    /* =================================================
       VARIAZIONE 24 ORE
    ================================================== */

    const change =

        (
            (lastPrice -
             firstPrice) /

            firstPrice

        ) * 100;


    const result =
        document.getElementById(
            "chartResult"
        );


    result.textContent =

        (
            change >= 0
            ? "+"
            : ""
        ) +

        change.toFixed(2) +

        "%";


    result.style.color =
        trendColor;



    /* =================================================
       DATE / ORARI
    ================================================== */

    ctx.fillStyle =
        "#555";


    ctx.font =
        "10px Arial";


    const firstDate =
        new Date(
            points[0].time
        );


    const lastDate =
        new Date(
            points[
                points.length - 1
            ].time
        );


    const firstText =
        firstDate.toLocaleTimeString(
            "it-IT",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    const lastText =
        lastDate.toLocaleTimeString(
            "it-IT",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    ctx.fillText(

        firstText,

        left,

        height - 5

    );


    const lastTextWidth =
        ctx.measureText(
            lastText
        ).width;


    ctx.fillText(

        lastText,

        left +
        chartWidth -
        lastTextWidth,

        height - 5

    );

}



/* =====================================================
   AVVIO
===================================================== */

updatePrices();

updateHntChart();


/*
   Aggiornamento prezzi:
   ogni 5 minuti.
*/

setInterval(

    updatePrices,

    PRICE_REFRESH

);


/*
   Aggiornamento grafico:
   ogni 5 minuti.
*/

setInterval(

    updateHntChart,

    CHART_REFRESH

);


/*
   Ridisegna se cambia dimensione.
*/

window.addEventListener(

    "resize",

    updateHntChart

);

</script>
