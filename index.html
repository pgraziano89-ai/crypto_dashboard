<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Market Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050505;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

body {
    padding: 24px 8vw 15px 8vw;
}

h1 {
    text-align: center;
    font-size: 34px;
    letter-spacing: 6px;
    margin: 0 0 17px 0;
}

.section-title {
    color: #777777;
    font-size: 18px;
    letter-spacing: 4px;
    border-bottom: 1px solid #292929;
    padding-bottom: 7px;
    margin-bottom: 12px;
}


/* =====================================================
   CRYPTO
===================================================== */

.crypto-top {
    width: 100%;
    height: 145px;
    display: flex;
    gap: 2.4%;
}

.crypto-card {
    flex: 1;
    min-width: 0;
    height: 145px;

    background: linear-gradient(
        145deg,
        #151515,
        #0d0d0d
    );

    border: 2px solid #292929;
    border-radius: 17px;

    padding: 15px 8px;

    text-align: center;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);
}

.token-header {
    text-align: center;
}

.logo {
    display: inline-block;
    vertical-align: middle;

    width: 42px;
    height: 42px;

    margin-right: 10px;

    border-radius: 50%;
}

.symbol {
    display: inline-block;
    vertical-align: middle;

    font-size: 27px;
    font-weight: bold;
}

.price {
    margin-top: 7px;

    font-size: 34px;
    font-weight: bold;

    white-space: nowrap;
}

.change {
    margin-top: 5px;

    font-size: 18px;
    font-weight: bold;
}

.up {
    color: #00d084;
}

.down {
    color: #ff4d4d;
}


/* =====================================================
   HNT
===================================================== */

.hnt-row {
    width: 100%;
    height: 235px;

    margin-top: 16px;

    display: flex;
    gap: 2.2%;
}

.hnt-card {
    flex: 0 0 31%;
    min-width: 0;

    height: 235px;

    background: linear-gradient(
        145deg,
        #151515,
        #0d0d0d
    );

    border: 2px solid #292929;
    border-radius: 17px;

    padding: 18px;

    text-align: center;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);
}

.hnt-header {
    margin-top: 35px;
}

.hnt-logo {
    display: inline-block;
    vertical-align: middle;

    width: 43px;
    height: 43px;

    margin-right: 10px;

    border-radius: 50%;
}

.hnt-symbol {
    display: inline-block;
    vertical-align: middle;

    font-size: 28px;
    font-weight: bold;
}

.hnt-price {
    font-size: 42px;
    font-weight: bold;

    margin-top: 7px;

    white-space: nowrap;
}

.hnt-change {
    font-size: 20px;
    font-weight: bold;

    margin-top: 4px;
}

.hnt-label {
    color: #666666;

    font-size: 13px;

    margin-top: 7px;

    letter-spacing: 1px;
}


/* =====================================================
   GRAFICO HNT
===================================================== */

.chart-card {
    flex: 1;
    min-width: 0;

    height: 235px;

    background: linear-gradient(
        145deg,
        #151515,
        #0d0d0d
    );

    border: 2px solid #292929;
    border-radius: 17px;

    padding: 12px 15px 10px 15px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);

    overflow: hidden;
}

.chart-header {
    height: 20px;

    color: #888888;

    font-size: 15px;

    letter-spacing: 1px;
}

.chart-left {
    float: left;
}

.chart-right {
    float: right;

    font-weight: bold;
}

.chart-area {
    width: 100%;
    height: 190px;
}

#hntChart {
    display: block;

    width: 100%;
    height: 190px;
}


/* =====================================================
   STOCK / WERIDE
===================================================== */

.stock-section {
    margin-top: 16px;
}

.stock-card {
    width: 100%;
    height: 225px;

    background: linear-gradient(
        145deg,
        #151515,
        #0d0d0d
    );

    border: 2px solid #292929;
    border-radius: 17px;

    padding: 15px 22px 14px 22px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,0.35);

    overflow: hidden;
}

.stock-header {
    height: 55px;
}

.weride-logo {
    display: inline-block;
    vertical-align: middle;

    width: 48px;
    height: 48px;

    margin-right: 14px;
}

.stock-info {
    display: inline-block;
    vertical-align: middle;
}

.stock-title {
    font-size: 27px;
    font-weight: bold;
}

.stock-subtitle {
    color: #777777;

    font-size: 14px;

    margin-top: 3px;
}


/* =====================================================
   WERIDE PRICE
===================================================== */

.weride-price-box {
    width: 100%;
    height: 145px;

    margin-top: 5px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #111111,
            #090909
        );

    border-radius: 12px;
}

.weride-price-content {
    text-align: center;
}

.weride-price {
    font-size: 52px;
    font-weight: bold;

    line-height: 1;
}

.weride-change {
    margin-top: 12px;

    font-size: 21px;
    font-weight: bold;
}

.weride-status {
    margin-top: 7px;

    color: #666666;

    font-size: 12px;

    letter-spacing: 1px;
}


/* =====================================================
   STATO
===================================================== */

#updated {
    text-align: center;

    color: #777777;

    font-size: 13px;

    margin-top: 7px;
}

.status {
    display: inline-block;

    width: 8px;
    height: 8px;

    background: #00d084;

    border-radius: 50%;

    margin-right: 5px;
}

.status.old {
    background: #ffb000;
}

</style>

</head>


<body>


<h1>
    MARKET DASHBOARD
</h1>


<div class="section-title">
    CRYPTO
</div>


<div class="crypto-top">


    <!-- BTC -->

    <div class="crypto-card">

                class="logo"

        </div>

    <!-- ETH -->

            <img
                class="logo"
                src="https://assets.coingecko.com/coins/images/279/large/ethereum.png"
                alt="ETH">

            <span class="symbol">
                ETH
            </span>

        </div>

        <div
            class="price"
            id="ethereum">
            ---
        </div>

        <div
            class="change"
            id="ethereum-change">
            ---
        </div>

    </div>


    <!-- SOL -->

    <div class="crypto-card">

        <div class="token-header">

            <img
                class="logo"
                src="https://assets.coingecko.com/coins/images/4128/large/solana.png"
                alt="SOL">

            <span class="symbol">
                SOL
            </span>

        </div>

        <div
            class="price"
            id="solana">
            ---
        </div>

        <div
            class="change"
            id="solana-change">
            ---
        </div>

    </div>


</div>


<!-- =====================================================
     HNT + GRAFICO
===================================================== -->

<div class="hnt-row">


    <div class="hnt-card">

        <div class="hnt-header">

            <img
                class="hnt-logo"
                src="https://assets.coingecko.com/coins/images/4284/large/Helium_HNT.png"
                alt="HNT">

            <span class="hnt-symbol">
                HNT

        </div>

        <div

    <!-- GRAFICO HNT -->

    <div class="chart-card">

            <span

        <div class="chart-area">

</div>


<!-- =====================================================
     STOCK WERIDE
===================================================== -->

<div class="stock-section">

    <div class="section-title">
        STOCK
    </div>


    <div class="stock-card">

        <div class="stock-header">


            <svg
                class="weride-logo"
                viewBox="0 0 100 100"
                xmlns="http://www.w3.org/2000/svg">

                <rect
                    width="100"
                    height="100"
                    rx="20"
                    fill="#ffffff"/>

                <circle
                    cx="50"
                    cy="50"
                    r="37"
                    fill="#111111"/>

                <path
                    d="M26 53 L36 53 L43 34 L51 66 L60 42 L67 53 L75 53"
                    fill="none"

                    stroke-linejoin="round"/>

            </svg>


            <div class="stock-info">

        <!-- SOLO PREZZO WRD -->

        <div class="weride-price-box">

                    class="weride-change"
                    id="weride-change">
                    ---

</div>


<div id="updated">

    <span
        class="status"
        id="status">
    </span>

    Avvio...

</div>


<script>


/* =====================================================
   CONFIGURAZIONE
===================================================== */

var PRICE_REFRESH = 90000;
var CHART_REFRESH = 90000;
var WERIDE_REFRESH = 60000;


/* =====================================================
   PREZZI COINGECKO
===================================================== */

function updatePrices() {

    var xhr =
        new XMLHttpRequest();


    var url =
        "https://api.coingecko.com/api/v3/simple/price" +
        "?ids=bitcoin,ethereum,solana,helium" +
        "&vs_currencies=usd" +
        "&include_24hr_change=true";


    xhr.open(
        "GET",
        url,
        true
    );


    xhr.onreadystatechange =
        function() {

            if (
                xhr.readyState != 4
            ) {
                return;
            }


            if (
                xhr.status != 200
            ) {

                document.getElementById(
                    "updated"
                ).innerHTML =
                    '<span class="status old"></span>' +
                    "Connessione non disponibile";

                return;
            }


            try {

                var data =
                    JSON.parse(
                        xhr.responseText
                    );

                var valid = 0;


                /* BTC */

                if (
                    data.bitcoin &&
                    data.bitcoin.usd !== undefined
                ) {

                    showCoin(
                        "bitcoin",
                        data.bitcoin.usd,
                        data.bitcoin.usd_24h_change
                    );

                    valid++;
                }


                /* ETH */

                if (
                    data.ethereum &&
                    data.ethereum.usd !== undefined
                ) {

                    showCoin(
                        "ethereum",
                        data.ethereum.usd,
                        data.ethereum.usd_24h_change
                    );

                    valid++;
                }


                /* SOL */

                if (
                    data.solana &&
                    data.solana.usd !== undefined
                ) {

                    showCoin(
                        "solana",
                        data.solana.usd,
                        data.solana.usd_24h_change
                    );

                    valid++;
                }


                /* HNT */

                if (
                    data.helium &&
                    data.helium.usd !== undefined
                ) {

                    showCoin(
                        "helium",
                        data.helium.usd,
                        data.helium.usd_24h_change
                    );

                    valid++;
                }


                if (
                    valid > 0
                ) {

                    document.getElementById(
                        "updated"
                    ).innerHTML =

                        '<span class="status"></span>' +
                        valid +
                        "/4 crypto · " +
                        new Date()
                        .toLocaleTimeString("it-IT") +
                        " · CoinGecko";

                }
                else {

                    document.getElementById(
                        "updated"
                    ).innerHTML =
                        '<span class="status old"></span>' +
                        "Dati non disponibili";

                }

            }
            catch (e) {

                document.getElementById(
                    "updated"
                ).innerHTML =
                    '<span class="status old"></span>' +
                    "Errore dati";

            }

        };


    xhr.onerror =
        function() {

            document.getElementById(
                "updated"
            ).innerHTML =
                '<span class="status old"></span>' +
                "Errore rete";

        };


    xhr.send(null);
}


/* =====================================================
   MOSTRA PREZZO CRYPTO
===================================================== */

function showCoin(
    name,
    price,
    change
) {

    var priceId =
        name;

    var changeId =
        name + "-change";


    if (
        name == "helium"
    ) {

        priceId =
            "helium";

        changeId =
            "helium-change";
    }


    var priceElement =
        document.getElementById(
            priceId
        );

    var changeElement =
        document.getElementById(
            changeId
        );


    var number =
        Number(price);


    var decimals = 2;


    if (
        number < 1
    ) {

        decimals = 4;
    }


    if (
        number < 0.01
    ) {

        decimals = 6;
    }


    if (
        priceElement
    ) {

        priceElement.innerHTML =
            "$ " +
            number.toFixed(
                decimals
            );

    }


    if (
        changeElement &&
